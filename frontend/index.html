<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitTrack – Log in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100">
  <main class="container">
    <div class="card shadow-sm auth-card mx-auto">
      <div class="card-body p-4">
        <h1 class="h3 text-center mb-1">FitTrack</h1>
        <p class="text-center text-muted mb-4">Track workouts, meals and progress</p>

        <ul class="nav nav-pills nav-justified mb-3" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#loginTab" type="button">Log in</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#signupTab" type="button">Sign up</button></li>
        </ul>

        <div id="alert"></div>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="loginTab">
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label" for="loginEmail">Email</label>
                <input class="form-control" id="loginEmail" name="email" type="email" required autocomplete="email">
              </div>
              <div class="mb-3">
                <label class="form-label" for="loginPassword">Password</label>
                <input class="form-control" id="loginPassword" name="password" type="password" required autocomplete="current-password">
              </div>
              <button class="btn btn-primary w-100" type="submit">Log in</button>
            </form>
          </div>

          <div class="tab-pane fade" id="signupTab">
            <form id="signupForm">
              <div class="row g-2 mb-3">
                <div class="col">
                  <label class="form-label" for="firstName">First name</label>
                  <input class="form-control" id="firstName" name="first_name" required>
                </div>
                <div class="col">
                  <label class="form-label" for="lastName">Last name</label>
                  <input class="form-control" id="lastName" name="last_name" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="signupEmail">Email</label>
                <input class="form-control" id="signupEmail" name="email" type="email" required autocomplete="email">
              </div>
              <div class="mb-3">
                <label class="form-label" for="signupPassword">Password</label>
                <input class="form-control" id="signupPassword" name="password" type="password" minlength="8" maxlength="72" required autocomplete="new-password">
                <div class="form-text">At least 8 characters.</div>
              </div>
              <button class="btn btn-success w-100" type="submit">Create account</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (getToken()) window.location.href = "dashboard.html";

    async function login(email, password) {
      const res = await api("/login", { method: "POST", body: { email, password } });
      setToken(res.access_token);
      window.location.href = "dashboard.html";
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.submitter; btn.disabled = true;
      try {
        const { email, password } = formData(e.target);
        await login(email, password);
      } catch (err) {
        showAlert("alert", err.message);
      } finally { btn.disabled = false; }
    });

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.submitter; btn.disabled = true;
      try {
        const data = formData(e.target);
        await api("/sign-up", { method: "POST", body: data });
        await login(data.email, data.password);
      } catch (err) {
        showAlert("alert", err.message);
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FitTrack – Log activity</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>

  <main class="container pb-5">
    <h1 class="h4 mb-3">Log activity</h1>
    <div id="alert"></div>

    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#workoutTab" type="button">Workout</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#mealTab" type="button">Meal</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#weightTab" type="button">Weight</button></li>
    </ul>

    <div class="tab-content">
      <!-- Workouts -->
      <div class="tab-pane fade show active" id="workoutTab">
        <div class="row g-4">
          <div class="col-lg-5">
            <div class="card shadow-sm">
              <div class="card-body">
                <form id="workoutForm" class="row g-3">
                  <div class="col-12">
                    <label class="form-label" for="wName">Name</label>
                    <input class="form-control" id="wName" name="name" placeholder="e.g. Morning run" required maxlength="255">
                  </div>
                  <div class="col-6">
                    <label class="form-label" for="wType">Type</label>
                    <select class="form-select" id="wType" name="workout_type" required>
                      <option value="cardio">Cardio</option>
                      <option value="strength">Strength</option>
                      <option value="hiit">HIIT</option>
                      <option value="flexibility">Flexibility</option>
                      <option value="sports">Sports</option>
                      <option value="other">Other</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label class="form-label" for="wDate">Date</label>
                    <input class="form-control date-today" id="wDate" name="workout_date" type="date" required>
                  </div>
                  <div class="col-6">
                    <label class="form-label" for="wDuration">Duration (min)</label>
                    <input class="form-control" id="wDuration" name="duration_minutes" type="number" min="1" max="1440" required>
                  </div>
                  <div class="col-6">
                    <label class="form-label" for="wCalories">Calories burned</label>
                    <input class="form-control" id="wCalories" name="calories_burned" type="number" min="0" max="10000" placeholder="Optional">
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="wIntensity">Intensity</label>
                    <select class="form-select" id="wIntensity" name="intensity">
                      <option value="">—</option>
                      <option value="low">Low</option>
                      <option value="moderate">Moderate</option>
                      <option value="high">High</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="wNotes">Notes</label>
                    <textarea class="form-control" id="wNotes" name="notes" rows="2" maxlength="2000" placeholder="Optional"></textarea>
                  </div>
                  <div class="col-12"><button class="btn btn-primary" type="submit">Save workout</button></div>
                </form>
              </div>
            </div>
          </div>
          <div class="col-lg-7">
            <h2 class="h6 text-muted">Recent workouts</h2>
            <ul class="list-group shadow-sm" id="workoutList"></ul>
          </div>
        </div>
      </div>

      <!-- Meals -->
      <div class="tab-pane fade" id="mealTab">
        <div class="row g-4">
          <div class="col-lg-5">
            <div class="card shadow-sm">
              <div class="card-body">
                <form id="mealForm" class="row g-3">
                  <div class="col-12">
                    <label class="form-label" for="mName">What did you eat?</label>
                    <input class="form-control" id="mName" name="name" placeholder="e.g. Oats with banana" required maxlength="255">
                  </div>
                  <div class="col-6">
                    <label class="form-label" for="mType">Meal</label>
                    <select class="form-select" id="mType" name="meal_type" required>
                      <option value="breakfast">Breakfast</option>
                      <option value="lunch">Lunch</option>
                      <option value="dinner">Dinner</option>
                      <option value="snack">Snack</option>
                    </select>
                  </div>
                  <div class="col-6">
                    <label class="form-label" for="mDate">Date</label>
                    <input class="form-control date-today" id="mDate" name="meal_date" type="date" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="mCalories">Calories</label>
                    <input class="form-control" id="mCalories" name="calories" type="number" min="0" max="10000" required>
                  </div>
                  <div class="col-4">
                    <label class="form-label" for="mProtein">Protein g</label>
                    <input class="form-control" id="mProtein" name="protein_g" type="number" min="0" step="0.1">
                  </div>
                  <div class="col-4">
                    <label class="form-label" for="mCarbs">Carbs g</label>
                    <input class="form-control" id="mCarbs" name="carbs_g" type="number" min="0" step="0.1">
                  </div>
                  <div class="col-4">
                    <label class="form-label" for="mFat">Fat g</label>
                    <input class="form-control" id="mFat" name="fat_g" type="number" min="0" step="0.1">
                  </div>
                  <div class="col-12"><button class="btn btn-primary" type="submit">Save meal</button></div>
                </form>
              </div>
            </div>
          </div>
          <div class="col-lg-7">
            <h2 class="h6 text-muted">Recent meals</h2>
            <ul class="list-group shadow-sm" id="mealList"></ul>
          </div>
        </div>
      </div>

      <!-- Weight -->
      <div class="tab-pane fade" id="weightTab">
        <div class="row g-4">
          <div class="col-lg-5">
            <div class="card shadow-sm">
              <div class="card-body">
                <form id="weightForm" class="row g-3">
                  <div class="col-12">
                    <label class="form-label" for="bDate">Date</label>
                    <input class="form-control date-today" id="bDate" name="log_date" type="date" required>
                  </div>
                  <div class="col-6">
                    <label class="form-label" for="bWeight">Weight (kg)</label>
                    <input class="form-control" id="bWeight" name="weight_kg" type="number" min="1" max="999" step="0.01" required>
                  </div>
                  <div class="col-6">
                    <label class="form-label" for="bFat">Body fat %</label>
                    <input class="form-control" id="bFat" name="body_fat_pct" type="number" min="1" max="99" step="0.1" placeholder="Optional">
                  </div>
                  <div class="col-12">
                    <div class="form-text mb-2">One entry per day — saving again for the same date replaces it.</div>
                    <button class="btn btn-primary" type="submit">Save weight</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
          <div class="col-lg-7">
            <h2 class="h6 text-muted">Weight history</h2>
            <ul class="list-group shadow-sm" id="weightList"></ul>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    requireAuth();
    renderNav("log.html");

    function resetDates() {
      document.querySelectorAll(".date-today").forEach(el => { el.value = todayStr(); el.max = todayStr(); });
    }

    function emptyItem(text) {
      return `<li class="list-group-item text-muted">${text}</li>`;
    }

    function deleteButton(onclick) {
      return `<button class="btn btn-sm btn-outline-danger" onclick="${onclick}">Delete</button>`;
    }

    async function loadWorkouts() {
      const items = await api("/workouts?limit=15");
      document.getElementById("workoutList").innerHTML = items.length ? items.map(w => `
        <li class="list-group-item d-flex justify-content-between align-items-start">
          <div>
            <div class="fw-semibold">${escapeHtml(w.name)} <span class="badge text-bg-light">${escapeHtml(w.workout_type)}</span></div>
            <div class="small text-muted">
              ${formatDay(w.workout_date)} · ${w.duration_minutes} min
              ${w.calories_burned != null ? ` · ${w.calories_burned} kcal` : ""}
              ${w.intensity ? ` · ${escapeHtml(w.intensity)}` : ""}
            </div>
            ${w.notes ? `<div class="small">${escapeHtml(w.notes)}</div>` : ""}
          </div>
          ${deleteButton(`removeItem('/workouts/${w.id}', loadWorkouts)`)}
        </li>`).join("") : emptyItem("No workouts yet.");
    }

    async function loadMeals() {
      const items = await api("/meals?limit=15");
      document.getElementById("mealList").innerHTML = items.length ? items.map(m => {
        const macros = [["P", m.protein_g], ["C", m.carbs_g], ["F", m.fat_g]]
          .filter(([, v]) => v != null).map(([k, v]) => `${k} ${Number(v)}g`).join(" · ");
        return `
          <li class="list-group-item d-flex justify-content-between align-items-start">
            <div>
              <div class="fw-semibold">${escapeHtml(m.name)} <span class="badge text-bg-light">${escapeHtml(m.meal_type)}</span></div>
              <div class="small text-muted">${formatDay(m.meal_date)} · ${m.calories} kcal${macros ? " · " + macros : ""}</div>
            </div>
            ${deleteButton(`removeItem('/meals/${m.id}', loadMeals)`)}
          </li>`;
      }).join("") : emptyItem("No meals yet.");
    }

    async function loadWeights() {
      const items = await api("/body-metrics?limit=15");
      document.getElementById("weightList").innerHTML = items.length ? items.map(b => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div>
            <span class="fw-semibold">${Number(b.weight_kg)} kg</span>
            ${b.body_fat_pct != null ? `<span class="text-muted"> · ${Number(b.body_fat_pct)}% fat</span>` : ""}
            <div class="small text-muted">${formatDay(b.log_date)}</div>
          </div>
          ${deleteButton(`removeItem('/body-metrics/${b.log_date}', loadWeights)`)}
        </li>`).join("") : emptyItem("No weight entries yet.");
    }

    async function removeItem(path, reload) {
      if (!confirm("Delete this entry?")) return;
      try {
        await api(path, { method: "DELETE" });
        await reload();
      } catch (err) {
        showAlert("alert", err.message);
      }
    }

    function handleForm(formId, path, method, reload, successMsg) {
      document.getElementById(formId).addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = e.submitter; btn.disabled = true;
        try {
          await api(path, { method, body: formData(e.target) });
          e.target.reset();
          resetDates();
          showAlert("alert", successMsg, "success");
          await reload();
        } catch (err) {
          showAlert("alert", err.message);
        } finally { btn.disabled = false; }
      });
    }

    handleForm("workoutForm", "/workouts", "POST", loadWorkouts, "Workout saved.");
    handleForm("mealForm", "/meals", "POST", loadMeals, "Meal saved.");
    handleForm("weightForm", "/body-metrics", "PUT", loadWeights, "Weight saved.");

    resetDates();
    Promise.all([loadWorkouts(), loadMeals(), loadWeights()]).catch(err => showAlert("alert", err.message));
  </script>
</body>
</html>
